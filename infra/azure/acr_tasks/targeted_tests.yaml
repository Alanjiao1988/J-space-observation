version: v1.1.0
# ACR Tasks definition for bounded, exact-commit test runs.
# The version line must stay first: ACR only enables alias/values support when
# it parses `version` as the first line, and silently runs zero steps otherwise.
# Uploaded as a standalone context with repo.bundle and targeted_tests.sh.
steps:
  - cmd: python:3.11-bookworm bash /workspace/targeted_tests.sh {{.Values.COMMIT}} {{.Values.TESTS}}
    timeout: 2400