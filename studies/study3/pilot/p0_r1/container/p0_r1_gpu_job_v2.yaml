# Study 3 P0-R1 generation-2 bounded GPU model-pilot job definition.
#
# Authority:
#   studies/study3/prompts/study3_p0_r1_post_ready_transport_exception_safety_authority.md
#   sections 5, 7, 8 and 9.
#
# This is the immutable definition of the ONE model-operating Azure Container
# Apps execution. This round commits and validates it; it does not create,
# update, start or allocate the job.
#
# The generation-1 definition named /workspace/p0_r1_model_pilot.sh, which is not
# a path in the image. A GPU replica would have been allocated, billed, and then
# failed on a missing command. The command here is /usr/local/bin/
# p0_r1_model_pilot_v2.sh, which the image build verified exists and is
# executable, and the pre-start guard rejects a mismatch before the replica runs.
#
# Every field that could silently authorize a second model operation is pinned:
#   * replicaRetryLimit 0        - the platform may never re-run a model job;
#   * parallelism 1              - one replica;
#   * replicaCompletionCount 1   - one completion;
#   * triggerType Manual         - nothing starts on a schedule or an event;
#   * image bound by digest      - a tag is never sufficient.
#
# The lock and the replay receipt are injected as size-checked, hash-checked
# environment payloads. They are not baked, so the image carries no
# outcome-conditioned byte and the same image serves the replay gate.
#
# The image carries no model weights. The checkpoints are fetched at run time
# from the exact pinned revisions recorded in the execution lock, one at a time,
# in fp16, with trust_remote_code=false.
apiVersion: 2024-03-01
kind: containerapp-job
name: job-jspace-study3-p0-r1-pilot-g2
resourceGroup: rg-jspace-observation-sea
subscription: 943bacdf-8b6e-4e3a-8126-a149f623d32e
properties:
  environmentId: cae-jspace-observation-sea-vnet2
  workloadProfileName: gpu-t4
  configuration:
    triggerType: Manual
    replicaTimeout: 7200
    replicaRetryLimit: 0
    manualTriggerConfig:
      parallelism: 1
      replicaCompletionCount: 1
    registries:
      - server: acrjspaceobssea0708231738.azurecr.io
        identity: /subscriptions/943bacdf-8b6e-4e3a-8126-a149f623d32e/resourcegroups/rg-jspace-observation-sea/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-jspace-aca-acrpull-sea
  template:
    containers:
      - name: p0-r1-pilot-g2
        # The digest is filled in from the published generation-2 execution lock
        # at launch time. It is deliberately not a tag and deliberately not a
        # placeholder that could resolve to something else.
        image: acrjspaceobssea0708231738.azurecr.io/j-space-observation-study3-p0-r1@IMAGE_DIGEST_FROM_EXECUTION_LOCK_V2
        # An absolute path the image installed and the build verified.
        command: ["/usr/local/bin/p0_r1_model_pilot_v2.sh"]
        args: ["IMAGE_DIGEST_FROM_EXECUTION_LOCK_V2", "READY_COMMIT"]
        resources:
          cpu: 8
          memory: 56Gi
        env:
          - name: P0_R1_SRC
            value: /opt/jspace/src
          - name: RESULTS_DIR
            value: /workspace/runtime/results
          - name: INJECTED_DIR
            value: /workspace/runtime/injected
          # Injected at launch from the published lock and the replay receipt.
          # Both are size-checked and hash-checked before use, and an oversize
          # payload refuses and demands the object-store route.
          - name: P0_R1_LOCK_V2_B64
            value: LOCK_INJECTION_PAYLOAD_FROM_LAUNCHER
          - name: P0_R1_REPLAY_RECEIPT_B64
            value: RECEIPT_INJECTION_PAYLOAD_FROM_LAUNCHER
          - name: P0_R1_RESULT_ACCOUNT
            value: stjspacefiles0709085305
          - name: P0_R1_RESULT_CONTAINER
            value: jspace-results
          - name: HF_HUB_DISABLE_TELEMETRY
            value: "1"
          - name: TOKENIZERS_PARALLELISM
            value: "false"
identity:
  type: UserAssigned
  userAssignedIdentities:
    /subscriptions/943bacdf-8b6e-4e3a-8126-a149f623d32e/resourcegroups/rg-jspace-observation-sea/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-jspace-aca-acrpull-sea: {}
boundary:
  model_operating_executions_authorized: 1
  command_exists_in_the_image: true
  result_persistence: "every artifact is written to the private storage account over the managed-identity route and read back byte-for-byte before the container may exit successfully"
  premature_exit: "any premature exit writes a durable infrastructure receipt naming the stage in flight; the receipt refuses the retry, it does not authorize one"
  additional_infrastructure_attempt: "only with a signed receipt proving zero tokenizer constructions, encodes, checkpoint downloads, model loads, GPU model operations, prefills, decodes, generations and scored rows"
  output_conditioned_retry_authorized: false
  partial_result_is_a_reportable_outcome: true
  hosted_provider_inference_calls: 0
  seeds: 0
  bank_rows: 0
  positive_reference_operations: 0
  evidence_ledger_rows: 0
