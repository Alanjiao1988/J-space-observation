# Study 3 P0-R2 generation-2 hard-kill / open-admission CPU recovery canary.
#
# Authority: studies/study3/prompts/
# study3_p0_r2_generation2_successor_and_conditional_execution_authority.md
# section 7.4.
#
# A real SIGKILL, not a simulated exception. The child admits an irreversible
# synthetic operation, commits at least one payload, signals readiness and then
# blocks forever; the parent hard-kills it and an independent CPU recovery must
# find the open admission and every payload byte, byte-exactly against
# independently regenerated bytes.
#
# replicaRetryLimit is 0 because a retried canary would silently replace the
# very evidence it exists to produce.
apiVersion: 2024-03-01
kind: containerapp-job
name: job-jspace-s3-p0r2-hardkill-g2
resourceGroup: rg-jspace-observation-sea
environmentId: /subscriptions/943bacdf-8b6e-4e3a-8126-a149f623d32e/resourceGroups/rg-jspace-observation-sea/providers/Microsoft.App/managedEnvironments/cae-jspace-observation-sea-vnet2
workloadProfileName: Consumption
identity:
  type: UserAssigned
  userAssignedIdentities:
    - /subscriptions/943bacdf-8b6e-4e3a-8126-a149f623d32e/resourcegroups/rg-jspace-observation-sea/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-jspace-aca-acrpull-sea
configuration:
  triggerType: Manual
  replicaTimeout: 1800
  replicaRetryLimit: 0
  manualTriggerConfig:
    parallelism: 1
    replicaCompletionCount: 1
  registries:
    - server: acrjspaceobssea0708231738.azurecr.io
      identity: /subscriptions/943bacdf-8b6e-4e3a-8126-a149f623d32e/resourcegroups/rg-jspace-observation-sea/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-jspace-aca-acrpull-sea
template:
  containers:
    - name: hardkill
      image: DIGEST_PINNED_AT_CREATION
      command:
        - /bin/sh
      args:
        - -c
        - |
          set -eu
          R2="${P0_R2_SRC}/studies/study3/pilot/p0_r2"
          export PYTHONPATH="${R2}:${P0_R2_SRC}/studies/study3/pilot/p0_r1"
          echo "P0_R2_G2_HARDKILL_ATTEMPT=${P0_R2_ATTEMPT}"
          python3 - <<'PY'
          import json, os
          import p0_r2_namespace_g2 as NS
          canary = NS.hard_kill_canary()
          report = canary.run_canary(attempt_id=os.environ["P0_R2_ATTEMPT"],
                                     rows=int(os.environ.get("P0_R2_HARD_KILL_ROWS", "2")))
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
          echo "P0_R2_G2_HARDKILL_COMPLETE=1"
          echo "P0_R2_MODEL_OPERATIONS_PERFORMED=0"
      resources:
        cpu: 2.0
        memory: 4Gi
      env:
        - name: P0_R2_ATTEMPT
          value: ATTEMPT_ID_AT_CREATION
        - name: P0_R2_SRC
          value: /opt/jspace/src
        - name: P0_R2_RUNTIME_ROOT
          value: /workspace/runtime
        - name: P0_R2_HARD_KILL_ROWS
          value: "2"
        - name: NVIDIA_VISIBLE_DEVICES
          value: void
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: void
        - name: CUDA_VISIBLE_DEVICES
          value: "-1"
boundary:
  stage: STUDY3-P0-R2
  generation: 2
  cpu_only: true
  accelerator_requested: false
  accelerator_environment_explicitly_neutralised: true
  workload_profile: Consumption
  replica_retry_limit: 0
  credential: managed-identity
  tokenizer_constructions: 0
  tokenizer_encodes: 0
  checkpoint_downloads: 0
  model_weight_loads: 0
  prefills: 0
  generations: 0
  scored_rows: 0
  gpu_allocations: 0
  model_operations_performed: 0
  payload: synthetic-only
  disjoint_attempt_prefix: true
  real_sigkill: true
  simulated_exception_substituted: false
  replay_gate_invoked: false
  one_shot_envelope_opened: false
  waivable: false
